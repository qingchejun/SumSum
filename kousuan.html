<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>口算 · 练习纸</title>
  <meta name="description" content="给孩子打印 A4 练习纸：口算、奥数、数独、识字四个板块。口算页：加减乘除、四则运算，自定义范围，每题可附答案页。" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✏️</text></svg>" />
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/sheet.css" />
  <style id="page-style">@page { size: A4 portrait; margin: 15mm; }</style>
</head>
<body>

<div class="app">
<!-- rail:口算 -->
<nav class="rail" aria-label="板块">
  <a class="rail-brand" href="index.html">练习纸</a>
  <a class="rail-link" href="index.html" data-module="今天"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7M6 9.5V20h12V9.5M10 20v-5h4v5"/></svg><span>今天</span></a>
  <a class="rail-link active" href="kousuan.html" data-module="口算" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h6M7 4v6M14 7h6M5 15l4 4M9 15l-4 4M14 16h6M14 19h6"/></svg><span>口算</span></a>
  <a class="rail-link" href="aoshu.html" data-module="奥数"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.8.8 1 1.5 1 2.5h6c0-1 .2-1.7 1-2.5A6 6 0 0 0 12 3z"/></svg><span>奥数</span></a>
  <a class="rail-link" href="shudu.html" data-module="数独"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9.3 4v16M14.7 4v16M4 9.3h16M4 14.7h16"/></svg><span>数独</span></a>
  <a class="rail-link" href="shizi.html" data-module="识字"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6c-2-1.5-5-2-8-1.5v14c3-.5 6 0 8 1.5 2-1.5 5-2 8-1.5v-14c-3-.5-6 0-8 1.5zM12 6v14"/></svg><span>识字</span></a>
  <span class="rail-gap"></span>
  <button type="button" class="rail-link small" data-help><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17.5v.01"/></svg><span>说明</span></button>
  <button type="button" class="rail-link small" data-backup><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M8 11l4 4 4-4M5 19h14"/></svg><span>备份</span></button>
</nav>
<!-- /rail -->

<div class="work">
  <header class="work-head">
    <h1 class="work-title">口算</h1>
    <span class="work-sum" id="work-sum"></span>
    <span class="work-grow"></span>
    <button type="button" id="btn-regen" class="btn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6"/></svg>重新生成</button>
    <button type="button" id="btn-print" class="btn btn-primary btn-lg"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 9V4h10v5M7 17H5a1 1 0 0 1-1-1v-6a1 1 0 0 1 1-1h14a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1h-2M7 14h10v6H7z"/></svg>打印</button>
  </header>

  <div class="work-body">

    <!-- ======== 练习纸预览（所见即所得） ======== -->
    <main class="preview" id="preview-wrap">
      <div class="notice" id="notice" hidden></div>
      <div id="preview"></div>
    </main>

    <!-- ======== 设置 ======== -->
    <aside class="panel" id="panel" aria-label="设置">

      <section class="group">
        <h2 class="group-title">快速预设</h2>
        <div class="preset-row" id="preset-row"></div>
      </section>

      <section class="group">
        <h2 class="group-title">出什么题</h2>
        <label class="field"><span>运算模式</span>
          <select id="f-mode" class="input">
            <option value="add">加法</option>
            <option value="sub">减法</option>
            <option value="addsub">加减法混合</option>
            <option value="mul">乘法</option>
            <option value="div">除法</option>
            <option value="muldiv">乘除法混合</option>
            <option value="addsubmul">加减法 + 少量乘法（乘法约占两成）</option>
            <option value="mixed">四则运算（2～3 步）</option>
          </select>
        </label>
        <div class="pair" data-show="add sub addsub addsubmul mixed">
          <label class="field"><span>最小值</span>
            <input type="number" id="f-min" class="input" min="0" max="9999" step="1" />
          </label>
          <label class="field"><span>最大值</span>
            <input type="number" id="f-max" class="input" min="1" max="10000" step="1" />
          </label>
        </div>
        <p class="hint" data-show="add addsub addsubmul mixed">加法的和也不超过最大值。</p>
        <div class="pair" data-show="mul div muldiv addsubmul mixed">
          <label class="field"><span>乘除数最小</span>
            <input type="number" id="f-mulmin" class="input" min="1" max="999" step="1" />
          </label>
          <label class="field"><span>乘除数最大</span>
            <input type="number" id="f-mulmax" class="input" min="1" max="999" step="1" />
          </label>
        </div>
        <div class="field" data-show="add sub addsub addsubmul"><span>进位 / 退位</span>
          <select id="f-carry" class="input" data-seg aria-label="进位 / 退位">
            <option value="random" data-short="随机">随机（不限制）</option>
            <option value="carrymore" data-short="为主">以进位 / 退位为主</option>
            <option value="nocarry" data-short="不出">不出进位 / 退位题</option>
            <option value="carryonly" data-short="只出">只出进位 / 退位题</option>
          </select>
        </div>
      </section>

      <section class="group">
        <h2 class="group-title">题量与排版</h2>
        <div class="pair">
          <label class="field"><span>题目数量</span>
            <input type="number" id="f-count" class="input" min="2" max="100" step="1" />
          </label>
          <div class="field"><span>纸张方向</span>
            <select id="f-paper" class="input" data-seg aria-label="纸张方向">
              <option value="portrait" data-short="纵向">A4 纵向</option>
              <option value="landscape" data-short="横向">A4 横向</option>
            </select>
          </div>
        </div>
        <div class="pair">
          <div class="field"><span>列数</span>
            <select id="f-columns" class="input" data-seg aria-label="列数">
              <option value="2" data-short="2">2 列</option>
              <option value="3" data-short="3">3 列</option>
              <option value="4" data-short="4">4 列</option>
            </select>
          </div>
          <!-- 四则模式不显示：多步算式只挖结果，随机挖空不适用 -->
          <div class="field" data-show-inline="add sub addsub mul div muldiv addsubmul"><span>填空位置</span>
            <select id="f-blank" class="input" data-seg aria-label="填空位置">
              <option value="end" data-short="末尾">答案在末尾</option>
              <option value="random" data-short="挖空">随机挖空</option>
            </select>
          </div>
        </div>
      </section>

      <section class="group">
        <details class="more" id="more-opts">
          <summary>更多选项 <span class="sub" id="more-count"></span></summary>
          <label class="check" data-show-inline="sub addsub addsubmul mixed">
            <input type="checkbox" id="f-nonneg" /><span>减法不出负数</span>
          </label>
          <!-- 四则模式不显示：多步算式内的除法必然整除，无法表示余数 -->
          <label class="check" data-show-inline="div muldiv">
            <input type="checkbox" id="f-exactdiv" /><span>除法必须整除（关闭则出「…余…」）</span>
          </label>
          <label class="check" data-show-inline="mixed">
            <input type="checkbox" id="f-parens" /><span>四则运算允许括号</span>
          </label>
          <label class="check">
            <input type="checkbox" id="f-skiptrivial" /><span>跳过送分题（如 7 + 0、5 × 1、8 − 8）</span>
          </label>
          <label class="check">
            <input type="checkbox" id="f-nodup" /><span>题目不重复</span>
          </label>
          <label class="check">
            <input type="checkbox" id="f-anspage" /><span>打印时附答案页</span>
          </label>
          <label class="check" data-show-inline="add sub addsub addsubmul">
            <input type="checkbox" id="f-stephint" /><span>答案页附凑十 / 破十提示（供家长讲解）</span>
          </label>
        </details>
      </section>

      <section class="group">
        <label class="field"><span>练习纸标题（选填）</span>
          <input type="text" id="f-title" class="input" maxlength="30" placeholder="留空则自动生成，如：20以内加减法练习" />
        </label>
        <p class="hint">设置和这批题目都写进了网址：收藏或分享这个链接，打开后就是一模一样的一张卷子。</p>
      </section>

    </aside>
  </div>
</div>
</div>

<script src="js/shell.js"></script>
<script src="js/generator.js"></script>
<script src="js/settings.js"></script>
<script src="js/render.js"></script>
<script src="js/main.js"></script>
<script src="js/backup.js"></script>
<script src="js/help.js"></script>
</body>
</html>
